<main>
  <header>
    <h1>Binding1</h1>
    <p>Лабораторна робота №1. Прив’язка даних в Angular.</p>
  </header>

  <section aria-labelledby="task-1">
    <h2 id="task-1">Вправа 1. Інтерполяція</h2>
    <p>Ім’я: {{ name() }}</p>
    <p>Вік: {{ age() }}</p>
  </section>

  <section aria-labelledby="task-2">
    <h2 id="task-2">Вправа 2. Прив’язка властивостей</h2>
    <div class="fields">
      <label for="property-name">
        Ім’я через [value]
        <input id="property-name" type="text" [value]="name()">
      </label>
      <label for="property-age">
        Вік через [value]
        <input id="property-age" type="text" [value]="age()">
      </label>
    </div>
    <p [textContent]="name()"></p>
    <p class="note">Введення в ці поля не змінює ім’я чи вік у компоненті.</p>
  </section>

  <section aria-labelledby="task-3">
    <h2 id="task-3">Вправа 3. Прив’язка атрибута</h2>
    <table aria-label="Приклад об’єднання комірок">
      <tbody>
        <tr><td [attr.colspan]="colspan">Одна комірка на два стовпці</td></tr>
        <tr><td>Три</td><td>Чотири</td></tr>
        <tr><td>П’ять</td><td>Шість</td></tr>
      </tbody>
    </table>
  </section>
</main>
